<!DOCTYPE html>
<html class="sl-theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta content="JavaStream" property="og:title" />
    <meta content="JavaStream Dashboard Login" property="og:description" />
    <meta content="#1fd7a2" data-react-helmet="true" name="theme-color" />

    <title>JavaStream - Login</title>
    <link
      id="favicon"
      rel="icon"
      type="image/x-icon"
      href="https://i.imgur.com/jmVoVMu.jpeg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"
    ></script>

    <style>
      :root {
        color-scheme: dark;
        --js-bg: #0c1112;
        --js-panel: rgba(19, 27, 29, 0.9);
        --js-text: #f4f6f4;
        --js-muted: #a7b2b0;
        --js-accent: #1fd7a2;
        --js-border: rgba(255, 255, 255, 0.1);
        --js-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        --sl-color-primary-600: var(--js-accent);
        --sl-color-primary-700: #12b988;
        --sl-border-radius-medium: 12px;
        --sl-input-background-color: rgba(11, 17, 18, 0.7);
        --sl-input-border-color: rgba(255, 255, 255, 0.12);
        --sl-input-border-color-focus: rgba(31, 215, 162, 0.6);
        --sl-input-color: var(--js-text);
        --sl-input-label-color: var(--js-muted);
      }

      :not(:defined) {
        visibility: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 40px 18px;
        background:
          radial-gradient(900px at 8% -10%, rgba(31, 215, 162, 0.28), transparent 60%),
          radial-gradient(700px at 92% 8%, rgba(255, 180, 84, 0.2), transparent 60%),
          linear-gradient(180deg, #0c1112 0%, #0f181a 58%, #0a0f10 100%);
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        font-weight: 400;
        color: var(--js-text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.04), transparent 35%),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.04) 0,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px,
            transparent 80px
          );
        opacity: 0.4;
        pointer-events: none;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        right: -140px;
        bottom: -160px;
        background: radial-gradient(circle, rgba(31, 215, 162, 0.3), transparent 70%);
        filter: blur(12px);
        opacity: 0.9;
        z-index: -3;
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
        animation: rise 0.8s ease both;
      }

      .comet-text {
        font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
        font-size: clamp(1.8rem, 2.6vw, 2.6rem);
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--js-text);
        letter-spacing: -0.02em;
      }

      .admin-subtitle {
        font-size: 1rem;
        color: var(--js-muted);
        margin-bottom: 0;
      }

      .emoji {
        width: 1em;
        height: 1em;
        vertical-align: middle;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
      }

      .login-container {
        background: var(--js-panel);
        padding: 2.5rem;
        border-radius: 18px;
        border: 1px solid var(--js-border);
        box-shadow: var(--js-shadow);
        width: 100%;
        max-width: 420px;
        margin: 0 20px;
        backdrop-filter: blur(18px);
        animation: rise 0.9s ease both;
        animation-delay: 0.1s;
      }

      .form-item {
        margin-bottom: 1.4rem;
      }

      .login-button {
        width: 100%;
      }

      .error-message {
        margin-bottom: 1rem;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    
    </style>
  </head>

  <body>
    <div class="header">
      <p class="comet-text">
        <img
          class="emoji"
          src="https://fonts.gstatic.com/s/e/notoemoji/latest/2615/512.gif"
        />
        JavaStream
      </p>
      <p class="admin-subtitle">Admin dashboard access</p>
    </div>

    <div class="login-container">
      {% if error %}
      <div class="form-item error-message">
        <sl-alert variant="danger" open>
          <sl-icon slot="icon" name="exclamation-triangle"></sl-icon>
          <strong>{{ error }}</strong>
        </sl-alert>
      </div>
      {% endif %}

      <form method="post" action="/admin/login">
        <div class="form-item">
          <sl-input
            id="password"
            name="password"
            type="password"
            label="Admin Password"
            placeholder="Enter admin password"
            required
            autofocus
          ></sl-input>
        </div>

        <div class="form-item">
          <sl-button type="submit" variant="primary" class="login-button">
            Sign In
          </sl-button>
        </div>
      </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await Promise.allSettled([
          customElements.whenDefined("sl-button"),
          customElements.whenDefined("sl-alert"),
          customElements.whenDefined("sl-input"),
          customElements.whenDefined("sl-icon"),
        ]);

        document.body.classList.add("ready");

        // Handle form submission with loading state
        const form = document.querySelector("form");
        const submitButton = document.querySelector('sl-button[type="submit"]');

        form.addEventListener("submit", function () {
          submitButton.loading = true;
          submitButton.textContent = "Signing In...";
        });
      });
    </script>
  </body>
</html>
